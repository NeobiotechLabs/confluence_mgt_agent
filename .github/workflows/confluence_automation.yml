name: Confluence AA Space Automation

# Auto-PR 제거(2026-07): 출력 채널이 GitHub 파일 커밋+PR에서 Confluence 일일 리포트로 전환됨.
# 저장소 쓰기 권한 불필요 → read 전용으로 축소.
# 마이그레이션(작업 13): migrator.js가 report_aa_daily.js에 통합되어 별도 job 불필요.
permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = KST 09:00 — 매일 리포트 1장 생성이 정상(심박 신호)
  workflow_dispatch:

jobs:
  # migrate → audit → reorganize → Confluence 일일 리포트 POST를 한 프로세스에서 실행.
  # migrate/audit/reorganize가 실패해도 리포트 POST는 반드시 시도된다(심박 보장).
  # exit code는 리포트 POST 성패로만 결정된다(부분 실패는 리포트 내 경고로 기록).
  daily-report:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm install
      - name: Run daily report (migrate + audit + reorganize + report)
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: node scripts/report_aa_daily.js

  notify-failure:
    needs: daily-report
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Notify Slack on Failure
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify via Email on Failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 🚨 [Confluence 봇] 자동화 작업 실패 알림
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: Confluence Automation Bot
          body: daily-report(마이그레이션+리포트 POST) 단계에서 오류가 발생했습니다. "오늘 리포트가 없다"면 심박 정지입니다. GitHub Actions 로그를 확인해 주세요.
