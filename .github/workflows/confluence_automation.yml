name: Confluence AA Space Automation

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  audit-aa:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm install
      - name: Audit AA Space
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: node scripts/audit_aa_space.js
      - name: Auto-PR if decisions.json changed
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore(audit): auto-commit human decisions"
          title: "[bot] Audit human moves"
          branch: bot/audit-decisions
          branch-suffix: timestamp
          add-paths: config/classification_decisions.json

  reorganize-aa:
    needs: audit-aa
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm install
      - name: Reorganize AA Space
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/reorganize_aa_space.js

  migrate:
    needs: reorganize-aa
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '18', cache: 'npm' }
      - run: npm install
      - name: Migrator
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/migrator.js

  notify-failure:
    needs: [audit-aa, reorganize-aa, migrate]
    if: failure()
    runs-on: self-hosted
    steps:
      - name: Notify Slack on Failure
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify via Email on Failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 🚨 [Confluence 봇] 자동화 작업 실패 알림
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: Confluence Automation Bot
          body: audit / reorganize / migrate 단계 중 하나에서 오류가 발생했습니다. GitHub Actions 로그를 확인해 주세요.